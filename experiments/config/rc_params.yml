text.usetex: true
font.family: Times New Roman
font.size: 10
pdf.fonttype: 42
figure.figsize:
  # - 7.00137  # \textwidth in AAAI layout
  - 3.31314  # \columnwidth in AAAI layout
  - 2
figure.dpi: 300
figure.titleweight: bold
# figure.titlesize: 10
# axes.titlesize: 10
# xtick.labelsize: 7
# ytick.labelsize: 7
# legend.fontsize: 7
figure.titlesize: 7
axes.titlesize: 7
axes.labelsize: 7
xtick.labelsize: 7
ytick.labelsize: 7
legend.fontsize: 7
savefig.bbox: tight
savefig.pad_inches: 0.01
savefig.transparent: true
savefig.format: pdf
legend.framealpha: 1
grid.color: k
grid.alpha: 0.2
ytick.direction: in
xtick.direction: in
text.latex.preamble:
  \usepackage{times}

  \newcommand{\asterism}{\smash{
  \raisebox{-.5ex}{
  \setlength{\tabcolsep}{-.5pt}
  \begin{tabular}{@{}cc@{}}
  \multicolumn2c*\\[-2ex]*&*
  \end{tabular}}}}